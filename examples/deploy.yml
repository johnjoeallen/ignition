# Seed this into each zone's starter repo as .forgejo/workflows/deploy.yml
#
# Repo variables (Settings -> Actions -> Variables):
#   REGISTRY     git.<slug>.<BASE_DOMAIN>       e.g. git.alpha.hz.example.com
#   CONTROL_URL  https://control.<BASE_DOMAIN>  where hz-control answers
#   APP_PORT     8080                           the port your app listens on
# Repo secrets (Settings -> Actions -> Secrets):
#   FORGEJO_TOKEN  a token with package:write, for pushing to the registry
#   DEPLOY_TOKEN   the zone's CI token (state/zones/<slug>/deploy-token on the control host)

name: build and deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: docker-cli
    steps:
      - uses: actions/checkout@v4

      - name: Build and push
        run: |
          IMAGE="${{ vars.REGISTRY }}/${{ github.repository }}:${{ github.sha }}"
          echo "${{ secrets.FORGEJO_TOKEN }}" | docker login "${{ vars.REGISTRY }}" -u "${{ github.actor }}" --password-stdin
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy the live app
        run: |
          curl -fsS --retry 3 -X POST "${{ vars.CONTROL_URL }}/deploy" \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_TOKEN }}" \
            -H 'content-type: application/json' \
            -d "{\"image\": \"$IMAGE\", \"port\": ${{ vars.APP_PORT || 8080 }}}"
