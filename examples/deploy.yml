# Seed this into a zone's repo as .forgejo/workflows/deploy.yml
#
# A zone can run this from several repos — each deploys its own app at
# <APP_NAME>.apps.<slug>.<BASE_DOMAIN>. App names are unique within the zone.
#
# Runs on a push to `main` AND when a git tag (e.g. `v1.2.0`) appears. Releases
# are cut in the Forgejo web UI — Releases -> "New release", target `main` — so
# the tag is always made from reviewed, already-pushed history, not from a
# developer's laptop with `git push --tags`. Owning that is part of the zone
# admin role (see docs/roles.md).
#
# Each run builds and pushes two image tags — :<sha> (immutable) and :<ref>
# (the branch or git tag) — then deploys the :<ref> one. POST /deploy rolls it
# out now; the per-node Watchtower also watches that tag, so a later re-push
# (or a base-image rebuild) goes live on its own without another workflow run.
#
# Repo variables (Settings -> Actions -> Variables):
#   REGISTRY     git.<slug>.<BASE_DOMAIN>          e.g. git.alpha.hackzone.com
#   CONTROL_URL  https://admin.<slug>.<BASE_DOMAIN>  the zone's control endpoint
#   APP_NAME     my-app                            -> https://my-app.apps.<slug>.<BASE_DOMAIN>/
#   APP_PORT     8080                              the port your app listens on
# Repo secrets (Settings -> Actions -> Secrets):
#   FORGEJO_TOKEN  a token with package:write, for pushing to the registry
#   DEPLOY_TOKEN   the zone's CI token (state/zones/<slug>/deploy-token)

name: build and deploy

on:
  push:
    branches: [main]
    tags: ["*"]

jobs:
  deploy:
    runs-on: docker-cli
    steps:
      - uses: actions/checkout@v4

      - name: Build and push
        run: |
          REPO="${{ vars.REGISTRY }}/${{ github.repository }}"
          REF="${GITHUB_REF_NAME:-main}"          # branch name, or the git tag
          echo "${{ secrets.FORGEJO_TOKEN }}" | docker login "${{ vars.REGISTRY }}" -u "${{ github.actor }}" --password-stdin
          docker build -t "$REPO:${{ github.sha }}" -t "$REPO:$REF" .
          docker push "$REPO:${{ github.sha }}"
          docker push "$REPO:$REF"
          # deploy the branch/tag ref so the node's Watchtower can keep it fresh
          echo "IMAGE=$REPO:$REF" >> "$GITHUB_ENV"

      - name: Deploy
        run: |
          curl -fsS --retry 3 -X POST "${{ vars.CONTROL_URL }}/deploy" \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_TOKEN }}" \
            -H 'content-type: application/json' \
            -d "{\"app\": \"${{ vars.APP_NAME }}\", \"image\": \"$IMAGE\", \"port\": ${{ vars.APP_PORT || 8080 }}}"
