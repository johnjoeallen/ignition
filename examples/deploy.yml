# Seed this into a zone's repo as .forgejo/workflows/deploy.yml
#
# A zone can run this from several repos — each deploys its own app. App names
# are unique within the zone. Two hosts per app:
#
#   <APP_NAME>.apps.<slug>.<BASE_DOMAIN>   the RELEASE — from a version tag
#   <APP_NAME>.dev.<slug>.<BASE_DOMAIN>    DEV — the latest main HEAD
#
# This workflow runs on two triggers, and NEVER on a plain push to `main`:
#
#  1. push of a version tag (vX.Y.Z) — created by the console's Release
#     buttons (major / minor / fix). Builds and deploys to the .apps. host.
#  2. workflow_dispatch — fired by the console's "Deploy from main" button.
#     Builds the current main HEAD and deploys to the .dev. host.
#
# Each run builds and pushes :<sha> (immutable) and a moving tag (:<version> or
# :main-<sha>), then POSTs ignition-control /deploy with the channel + the built
# commit as `ref`. ignition-control reads THAT commit's compose.yaml to bring up
# the app's whole stack (web + any DB/cache/queue it declares). If CI re-runs for
# the same tag (e.g. a base-image rebuild) the per-node Watchtower rolls the web
# container forward without another deploy call.
#
# Assumes a Dockerfile and a compose.yaml at the repo root (both seeded by
# "Create app"). The runner's config forwards
# DOCKER_HOST=tcp://dind:2375, so `docker` here talks to the zone's private
# build engine.
#
# Repo variables (Settings -> Actions -> Variables):
#   REGISTRY     git.<slug>.<BASE_DOMAIN>            e.g. git.quantum-badgers.ignition.example
#                (must match the zone's registry exactly — ignition-control checks it)
#   CONTROL_URL   the ignition-control public URL          its /deploy endpoint
#   APP_NAME      my-app                             -> https://my-app.apps.<slug>.<BASE_DOMAIN>/
#   APP_PORT      8080                               fixed by ignition (Create app) — listen on $PORT/8080
#   REGISTRY_USER the Forgejo user to `docker login` as  (the zone bot; set by Create app)
# Repo secrets (Settings -> Actions -> Secrets):
#   DEPLOY_TOKEN   the zone's CI token (state/zones/<slug>/deploy-token)
#   FORGEJO_TOKEN  a real user token with write:package — set by Create app to
#                  the zone bot's PAT. Required: the automatic per-run Actions
#                  token (github.token) CANNOT push to Forgejo's container
#                  registry (it gets `unauthorized: reqPackageAccess` however
#                  `permissions:` is set), so a package push needs this.

name: build and deploy

on:
  push:
    tags: ["*"]
  workflow_dispatch:
    inputs:
      channel:
        description: "target host"
        default: dev
        type: choice
        options: [dev]

permissions:
  contents: read
  packages: write

concurrency:
  # releases queue (never clobber); a newer "Deploy from main" supersedes an
  # in-flight one
  group: deploy-${{ github.repository }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  deploy:
    runs-on: docker-cli
    steps:
      # The job image (code.forgejo.org/oci/docker:cli) is a bare Alpine +
      # Docker CLI: no Node.js (actions/checkout is a JavaScript action and
      # needs `node` on PATH — Alpine's nodejs is Node 24, well past
      # checkout@v4's floor) and no curl (the Deploy step below). Add both
      # up front, in `sh`, before any JS action runs.
      - name: Prepare job tools (node for checkout, curl for deploy)
        run: apk add --no-cache nodejs curl

      - uses: actions/checkout@v4

      - name: Build and push
        run: |
          REPO="${{ vars.REGISTRY }}/${{ github.repository }}"
          # POSIX sh (Alpine, no bash). Pick the channel + moving tag from the
          # trigger: a tag push is the release; workflow_dispatch is dev.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CHANNEL=dev
            TAG="main-$(printf '%s' "${{ github.sha }}" | cut -c1-12)"
          else
            CHANNEL=release
            TAG=$(printf '%s' "$GITHUB_REF_NAME" | tr '/' '-')
          fi
          echo "${{ secrets.FORGEJO_TOKEN || github.token }}" \
            | docker login "${{ vars.REGISTRY }}" -u "${{ vars.REGISTRY_USER || github.actor }}" --password-stdin
          docker build -t "$REPO:${{ github.sha }}" -t "$REPO:$TAG" .
          docker push "$REPO:${{ github.sha }}"
          docker push "$REPO:$TAG"
          echo "IMAGE=$REPO:$TAG" >> "$GITHUB_ENV"
          echo "CHANNEL=$CHANNEL" >> "$GITHUB_ENV"

      - name: Deploy
        run: |
          # ref = the exact commit built, so ignition-control reads THIS commit's
          # compose.yaml (web + any DB/cache it declares).
          curl -fsS --retry 3 -X POST "${{ vars.CONTROL_URL }}/deploy" \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_TOKEN }}" \
            -H 'content-type: application/json' \
            -d "{\"app\": \"${{ vars.APP_NAME }}\", \"image\": \"$IMAGE\", \"port\": ${{ vars.APP_PORT || 8080 }}, \"channel\": \"$CHANNEL\", \"ref\": \"${{ github.sha }}\"}"
