# Seed this into each team's starter repo as .gitea/workflows/deploy.yml
#
# Repo variables (Settings -> Actions -> Variables):
#   REGISTRY     <slug>.<BASE_DOMAIN>:<port>            e.g. team-a.hz.example.com:30000
#   DEPLOY_URL   https://deploy.<BASE_DOMAIN>           where deploy-agent.py answers
#   APP_PORT     8080                                    the port your app listens on
# Repo secrets (Settings -> Actions -> Secrets):
#   GITEA_TOKEN  a token with package:write for pushing to REGISTRY
#   DEPLOY_TOKEN the team's deploy token (state/<slug>/deploy-token on the host)

name: build and deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to the team registry
        run: echo "${{ secrets.GITEA_TOKEN }}" | docker login "${{ vars.REGISTRY }}" -u "${{ gitea.actor }}" --password-stdin

      - name: Build and push
        run: |
          IMAGE="${{ vars.REGISTRY }}/${{ gitea.repository }}:${{ gitea.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy the live app
        run: |
          curl -fsS --retry 3 -X POST "${{ vars.DEPLOY_URL }}/deploy" \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_TOKEN }}" \
            -H 'content-type: application/json' \
            -d "{\"image\": \"$IMAGE\", \"port\": ${{ vars.APP_PORT || 8080 }}}"
