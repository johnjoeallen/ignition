# The Ignition control plane — runs on the controller ONLY, next to that host's
# core stack (traefik-core-compose.yml). One Java service + a PostgreSQL it owns;
# every platform-admin and zone-admin operation is in its web UI. See DESIGN.md
# and AUTH-DESIGN.md.
#
#   export BASE_DOMAIN=ignition.example
#   export IGN_ADMIN_TOKEN=$(openssl rand -hex 32)          # platform key — keep it
#   export IGN_SECRET_KEY=$(head -c32 /dev/urandom | base64) # zone_secret AES key — keep it
#   export POSTGRES_PASSWORD=$(openssl rand -hex 24)
#   docker compose -f templates/ignition-control-compose.yml up -d
#
# PostgreSQL is the source of truth (nodes, zones, apps, secrets, identity).
# Back it up with `pg_dump`; the AES key is a separate secret. The control plane
# re-renders the compose / runner / Traefik-dynamic files it needs into an
# ephemeral work volume on every start.

name: ignition-control

networks:
  traefik-public:
    external: true
  ignition-internal:
    name: ignition-internal

volumes:
  ignition-pgdata:
  ignition-work:
  # shared with traefik-core: ignition-control writes the file-provider snippets,
  # traefik reads them.
  ignition-dynamic:
    name: ignition-dynamic

services:
  postgres:
    image: postgres:16-alpine
    container_name: ignition-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ignition
      POSTGRES_USER: ignition
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - ignition-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ignition -d ignition"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - ignition-internal

  ignition-control:
    image: ghcr.io/johnjoeallen/ignition-control:${IGN_CONTROL_VERSION:-latest}
    container_name: ignition-control
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BASE_DOMAIN: ${BASE_DOMAIN:?set BASE_DOMAIN}
      IGN_ADMIN_TOKEN: ${IGN_ADMIN_TOKEN:?set IGN_ADMIN_TOKEN}
      IGN_SECRET_KEY: ${IGN_SECRET_KEY:?set IGN_SECRET_KEY}
      IGN_WORK_DIR: /work
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ignition
      SPRING_DATASOURCE_USERNAME: ignition
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      # how the file-provider routers reach this service (it's on traefik-public)
      IGNITION_CONTROL_PLANE_URL: http://ignition-control:8790
      IGN_INSECURE_TLS: ${IGN_INSECURE_TLS:-false}
      IGN_SWEEP_TTL: ${IGN_SWEEP_TTL:-24h}
    volumes:
      # the local node's daemon
      - /var/run/docker.sock:/var/run/docker.sock
      # ephemeral scratch — rendered compose / runner config
      - ignition-work:/work
      # Traefik file-provider snippets (also mounted by traefik-core, read-only)
      - ignition-dynamic:/work/control/dynamic
      # keys / certs for ssh:// and tcp://+TLS nodes (optional; read-only)
      - ${IGN_SSH_DIR:-./ssh-empty}:/root/.ssh:ro
    networks:
      - traefik-public
      - ignition-internal

# `docker compose` won't create a bind source that doesn't exist, so make an
# empty ./ssh-empty if you have no remote nodes:  mkdir -p ssh-empty
