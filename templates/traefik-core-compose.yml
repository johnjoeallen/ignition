# Per-node core services — Traefik + Watchtower. Runs once on every node,
# before any zone is placed there.
#
#   export BASE_DOMAIN=example.com ACME_EMAIL=ops@example.com
#   export CF_DNS_API_TOKEN=...            # DNS-challenge creds for the certs
#   docker compose -f templates/traefik-core-compose.yml up -d
#
# Watchtower polls the zone registries and rolls any deployed app container
# forward when its image tag gets a new digest — so a re-pushed build (or a
# base-image rebuild) goes live without a fresh CI /deploy call. It only acts
# on containers labelled com.centurylinklabs.watchtower.enable=true (every
# app-compose.tmpl container carries it); Traefik, Forgejo, DinD and runners
# are never touched. Pushing to a floating tag (examples/deploy.yml pushes
# :<branch> alongside :<sha>) is what makes this useful.
#
# BASE_DOMAIN is the apex of the whole hackzone install (e.g. example.com).
# Traefik owns :80 / :443 on the node.
#
# Domain scheme:
#   admin.${BASE_DOMAIN}                 the platform admin control plane
#   <slug>.${BASE_DOMAIN}                a zone owns this whole subtree:
#     git.<slug>.${BASE_DOMAIN}            the zone's Forgejo
#     admin.<slug>.${BASE_DOMAIN}          the zone admin's control-plane view
#     <app>.apps.<slug>.${BASE_DOMAIN}     a deployed app (name unique per zone)
#
# The control host's Traefik holds the apex cert (${BASE_DOMAIN} + a
# *.${BASE_DOMAIN} SAN, which covers admin.${BASE_DOMAIN}) and fronts hz-control
# on the loopback. Each zone's own Forgejo router (see zone-compose.yml.tmpl)
# additionally requests *.<slug>.${BASE_DOMAIN} + *.apps.<slug>.${BASE_DOMAIN},
# since those are two labels deep. provision-zone.sh drops a dynamic router
# snippet in state/control/dynamic/<slug>.yml so admin.<slug>.${BASE_DOMAIN}
# reaches hz-control with its own cert.
#
# DNS: admin.${BASE_DOMAIN} -> the control host. Per zone, git.<slug> /
# admin.<slug> / *.apps.<slug> -> whichever node runs that zone (single node:
# one *.<slug>.${BASE_DOMAIN} record covers all three).

name: hackzone-core

networks:
  # The one shared network this node's Traefik watches. hz-control attaches
  # each zone's live app container here, and each zone's Forgejo joins it too.
  traefik-public:
    name: traefik-public

volumes:
  acme:

services:
  traefik:
    image: traefik:v3.3
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.network=traefik-public
      - --providers.docker.exposedbydefault=false
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls=true
      - --entrypoints.websecure.http.tls.certresolver=le
      - --entrypoints.websecure.http.tls.domains[0].main=${BASE_DOMAIN:?set BASE_DOMAIN}
      - --entrypoints.websecure.http.tls.domains[0].sans=*.${BASE_DOMAIN}
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL:?set ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/acme/acme.json
      - --certificatesresolvers.le.acme.dnschallenge=true
      - --certificatesresolvers.le.acme.dnschallenge.provider=${ACME_DNS_PROVIDER:-cloudflare}
      # Uncomment to watch the ACME exchange while getting DNS creds right:
      # - --log.level=DEBUG
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      # so a file-provider router can reach hz-control on the control host's loopback
      - "host.docker.internal:host-gateway"
    environment:
      # Cloudflare by default; swap ACME_DNS_PROVIDER + the matching var for
      # another provider (see https://doc.traefik.io/traefik/https/acme/).
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - acme:/acme
      - ../state/control/dynamic:/etc/traefik/dynamic:ro
    networks:
      - traefik-public

  watchtower:
    image: containrrr/watchtower:1.7.1
    restart: unless-stopped
    command: --label-enable --cleanup --rolling-restart --interval ${WATCHTOWER_INTERVAL:-60}
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      # Registry auth: `docker login git.<slug>.<BASE_DOMAIN>` on the node so
      # ~/.docker/config.json below can pull private app images.
      DOCKER_CONFIG: /config
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DOCKER_CONFIG_DIR:-/root/.docker}:/config:ro
