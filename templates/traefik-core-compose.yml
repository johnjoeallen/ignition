# Per-node Traefik. Runs once on every node, before any zone is placed there.
#
#   export BASE_DOMAIN=x.com ACME_EMAIL=ops@x.com
#   export CF_DNS_API_TOKEN=...            # DNS-challenge creds for the wildcard certs
#   docker compose -f templates/traefik-core-compose.yml up -d
#
# BASE_DOMAIN is the apex. Owns :80 / :443 on the node and holds three
# certificates, so any zone or app on this node is covered with no per-name
# cert request:
#   admin.${BASE_DOMAIN}          the control plane
#   *.git.${BASE_DOMAIN}          every zone's Forgejo   (<slug>.git.<base>)
#   *.apps.${BASE_DOMAIN}         every deployed app     (<name>.apps.<base>)
#
# DNS still routes per zone / per app: <slug>.git.<base> and <name>.apps.<base>
# A-records point at whichever node runs that zone/app (single-node: just make
# *.git.<base> and *.apps.<base> A-records).

name: hackzone-core

networks:
  # The one shared network this node's Traefik watches. hz-control attaches
  # each zone's live app container here, and each zone's Forgejo joins it too.
  traefik-public:
    name: traefik-public

volumes:
  acme:

services:
  traefik:
    image: traefik:v3.3
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.network=traefik-public
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls=true
      - --entrypoints.websecure.http.tls.certresolver=le
      - --entrypoints.websecure.http.tls.domains[0].main=admin.${BASE_DOMAIN:?set BASE_DOMAIN}
      - --entrypoints.websecure.http.tls.domains[1].main=git.${BASE_DOMAIN}
      - --entrypoints.websecure.http.tls.domains[1].sans=*.git.${BASE_DOMAIN}
      - --entrypoints.websecure.http.tls.domains[2].main=apps.${BASE_DOMAIN}
      - --entrypoints.websecure.http.tls.domains[2].sans=*.apps.${BASE_DOMAIN}
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL:?set ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/acme/acme.json
      - --certificatesresolvers.le.acme.dnschallenge=true
      - --certificatesresolvers.le.acme.dnschallenge.provider=${ACME_DNS_PROVIDER:-cloudflare}
      # Uncomment to watch the ACME exchange while getting DNS creds right:
      # - --log.level=DEBUG
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Cloudflare by default; swap ACME_DNS_PROVIDER + the matching var for
      # another provider (see https://doc.traefik.io/traefik/https/acme/).
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - acme:/acme
    networks:
      - traefik-public
