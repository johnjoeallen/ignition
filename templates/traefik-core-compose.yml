# Per-node core services — Traefik + Watchtower. Runs once on every node,
# before any zone is placed there.
#
#   export BASE_DOMAIN=example.com ACME_EMAIL=ops@example.com ACME_DNS_PROVIDER=<your dns host>
#   # put the DNS API creds for ACME_DNS_PROVIDER in ./acme.env (see below)
#   docker network create traefik-public
#   docker volume  create ignition-dynamic     # shared with ignition-control
#   docker compose --project-directory . -f templates/traefik-core-compose.yml up -d
#
# ACME_DNS_PROVIDER is any of Traefik's ~100 DNS providers — whatever hosts
# your zone (route53, hetzner, gandiv5, desec, rfc2136 for a self-run DNS, …);
# the matching credential env vars go in acme.env. Set ACME_CA_SERVER to point
# at a self-hosted step-ca instead of Let's Encrypt.
#
# Watchtower rolls any deployed app container forward if its image tag ever
# gets a new digest — e.g. CI re-runs for the same release tag after a
# base-image rebuild — without a fresh /deploy call. It only acts on containers
# labelled com.centurylinklabs.watchtower.enable=true, which ignition-control stamps
# on every app it deploys; Traefik, Forgejo, DinD and runners are never touched.
#
# BASE_DOMAIN is the apex of the whole Ignition install (e.g. example.com).
# Traefik owns :80 / :443 on the node.
#
# Domain scheme:
#   ${BASE_DOMAIN}                        the one console — every role (platform
#                                          admin, team admin, team member) signs
#                                          in here; what you see/do is by role,
#                                          not by hostname. A team's console is
#                                          ${BASE_DOMAIN}/z?z=<slug> on this host.
#   <slug>.${BASE_DOMAIN}                a zone owns this whole subtree:
#     git.<slug>.${BASE_DOMAIN}            the zone's Forgejo
#     <app>.apps.<slug>.${BASE_DOMAIN}     a deployed app (name unique per zone)
#
# The control host's Traefik holds the apex cert (${BASE_DOMAIN} + a
# *.${BASE_DOMAIN} SAN) and fronts ignition-control on the loopback. Each
# zone's own Forgejo router (see the bundled zone-compose.yml.tmpl)
# additionally requests *.<slug>.${BASE_DOMAIN} + *.apps.<slug>.${BASE_DOMAIN},
# since those are two labels deep.
#
# DNS: ${BASE_DOMAIN} -> the control host. Per zone, git.<slug> /
# *.apps.<slug> -> whichever node runs that zone (single node:
# one *.<slug>.${BASE_DOMAIN} record covers both).

name: ignition-core

networks:
  # The one shared network this node's Traefik watches. ignition-control attaches
  # each zone's live app container here, and each zone's Forgejo joins it too.
  traefik-public:
    name: traefik-public
    external: true

volumes:
  acme:
  # created by ignition-control-compose.yml; on a worker node that has no
  # control plane, `docker volume create ignition-dynamic` once.
  ignition-dynamic:
    name: ignition-dynamic
    external: true

services:
  traefik:
    # v3.5+ negotiates the Docker API version; older tags pin 1.24 and fail
    # against a modern daemon ("client version 1.24 is too old"). If you must
    # stay on an old Traefik, set DOCKER_MIN_API_VERSION=1.24 on the daemon.
    image: traefik:${TRAEFIK_VERSION:-v3.5}
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.network=traefik-public
      - --providers.docker.exposedbydefault=false
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls=true
      - --entrypoints.websecure.http.tls.certresolver=le
      - --entrypoints.websecure.http.tls.domains[0].main=${BASE_DOMAIN:?set BASE_DOMAIN}
      - --entrypoints.websecure.http.tls.domains[0].sans=*.${BASE_DOMAIN}
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL:?set ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/acme/acme.json
      - --certificatesresolvers.le.acme.dnschallenge=true
      - --certificatesresolvers.le.acme.dnschallenge.provider=${ACME_DNS_PROVIDER:?set ACME_DNS_PROVIDER}
      # ACME_CA_SERVER: leave unset for Let's Encrypt, or set to a self-hosted
      # step-ca directory URL for certs from your own CA.
      - --certificatesresolvers.le.acme.caserver=${ACME_CA_SERVER:-https://acme-v02.api.letsencrypt.org/directory}
      # TRAEFIK_LOG_LEVEL=DEBUG to watch the full ACME exchange while getting
      # DNS creds right (very verbose — includes the DNS provider's own
      # request/response traffic). INFO is the default either way; set it in
      # .env, don't edit this file.
      - --log.level=${TRAEFIK_LOG_LEVEL:-INFO}
      # Every request, not just errors — this is what answers "did the
      # request even reach Traefik, and what did it do with it" without
      # guessing from what's absent. CLF to stdout; picked up by `docker logs`
      # same as everything else here.
      - --accesslog=true
    ports:
      # Bind to a specific host interface on a multi-homed box (the corp-DMZ IP,
      # or the public IP) — see docs/exposure.md "Topologies". Default: all.
      - "${IGN_EXPOSE_ADDR:-0.0.0.0}:80:80"
      - "${IGN_EXPOSE_ADDR:-0.0.0.0}:443:443"
    extra_hosts:
      # so a file-provider router can reach ignition-control on the control host's loopback
      - "host.docker.internal:host-gateway"
    environment:
      # Traefik's docker client can fail to negotiate with a very new daemon
      # ("client version 1.24 is too old"). Pin a version the daemon accepts;
      # 1.44 works on Docker 25+. Lower it only for an older daemon.
      DOCKER_API_VERSION: ${DOCKER_API_VERSION:-1.44}
    env_file:
      # the DNS-provider credential vars for ACME_DNS_PROVIDER (e.g.
      # AWS_ACCESS_KEY_ID / HETZNER_API_KEY / RFC2136_* …). Create it:
      #   printf 'PROVIDER_TOKEN=…\n' > acme.env
      - path: acme.env
        required: false
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - acme:/acme
      # written by ignition-control (ignition-control-compose.yml)
      - ignition-dynamic:/etc/traefik/dynamic:ro
    networks:
      - traefik-public

  watchtower:
    image: containrrr/watchtower:1.7.1
    restart: unless-stopped
    command: --label-enable --cleanup --rolling-restart --interval ${WATCHTOWER_INTERVAL:-60}
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      DOCKER_API_VERSION: ${DOCKER_API_VERSION:-1.44}
      # Registry auth: `docker login git.<slug>.<BASE_DOMAIN>` on the node so
      # ~/.docker/config.json below can pull private app images.
      DOCKER_CONFIG: /config
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DOCKER_CONFIG_DIR:-/root/.docker}:/config:ro
