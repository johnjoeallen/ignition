spring:
  application:
    name: ignition-control
  thymeleaf:
    cache: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ignition}
    username: ${SPRING_DATASOURCE_USERNAME:ignition}
    password: ${SPRING_DATASOURCE_PASSWORD:ignition}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none          # Flyway owns the schema
  flyway:
    enabled: true

server:
  port: ${IGN_CONTROL_PORT:8790}
  address: ${IGN_CONTROL_ADDR:0.0.0.0}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

ignition:
  base-domain: ${IGN_BASE_DOMAIN:${BASE_DOMAIN:ignition.example}}
  work-dir: ${IGN_WORK_DIR:../work}
  secret-key: ${IGN_SECRET_KEY:}
  public-url: ${IGN_PUBLIC_URL:http://localhost:8790}
  insecure-tls: ${IGN_INSECURE_TLS:false}
  recreate-zones-on-start: ${IGN_RECREATE_ZONES_ON_START:false}
  smtp:
    host: ${IGN_SMTP_HOST:}
    port: ${IGN_SMTP_PORT:587}
    username: ${IGN_SMTP_USERNAME:}
    password: ${IGN_SMTP_PASSWORD:}
    from: ${IGN_SMTP_FROM:}
    starttls: ${IGN_SMTP_STARTTLS:true}
  sweep:
    ttl: ${IGN_SWEEP_TTL:24h}
    interval: ${IGN_SWEEP_INTERVAL:15m}

logging:
  level:
    net.dublinux.ignition: INFO
