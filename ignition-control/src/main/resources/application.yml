spring:
  application:
    name: ignition-control
  thymeleaf:
    cache: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ignition}
    username: ${SPRING_DATASOURCE_USERNAME:ignition}
    password: ${SPRING_DATASOURCE_PASSWORD:ignition}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: ${IGN_CONTROL_PORT:8790}
  address: ${IGN_CONTROL_ADDR:0.0.0.0}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

ignition:
  base-domain: ${IGN_BASE_DOMAIN:${BASE_DOMAIN:ignition.example}}
  admin-token: ${IGN_ADMIN_TOKEN:}
  work-dir: ${IGN_WORK_DIR:../work}
  secret-key: ${IGN_SECRET_KEY:}
  insecure-tls: ${IGN_INSECURE_TLS:false}
  sweep:
    ttl: ${IGN_SWEEP_TTL:24h}
    interval: ${IGN_SWEEP_INTERVAL:15m}

logging:
  level:
    net.dublinux.ignition: INFO
