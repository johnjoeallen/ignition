<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"><title>Ignition · reset password</title>
  <link rel="stylesheet" href="/css/ignition.css">
</head>
<body>
  <h1>Reset your password</h1>
  <div class="msg" th:if="${sent}">If that address has an account, a reset link is on its way.</div>
  <form method="post" th:action="@{/forgot}" class="stack" th:unless="${sent}">
    <label>Email <input name="email" type="email" autofocus required></label>
    <button>Send reset link</button>
  </form>
  <p class="muted"><a href="/login">Back to sign in</a></p>
</body>
</html>
