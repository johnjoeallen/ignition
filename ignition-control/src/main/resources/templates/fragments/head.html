<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">Ignition</title>
  <link rel="icon" type="image/svg+xml" href="/img/mark.svg">
  <link rel="alternate icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="stylesheet" href="/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="/vendor/icons/bootstrap-icons.css">
  <link rel="stylesheet" href="/css/ignition.css">
  <script>
    // Set before first paint so there's no flash of the wrong theme.
    (function () {
      try {
        var t = localStorage.getItem('ign-theme')
            || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-bs-theme', t);
      } catch (e) {}
    })();
  </script>
</head>
<body></body>
</html>
