<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">Ignition</title>
  <link rel="icon" type="image/svg+xml" href="/img/mark.svg">
  <link rel="alternate icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="/vendor/icons/bootstrap-icons.css">
  <link rel="stylesheet" href="/css/ignition.css">
  <script>
    // Theme registry + first-paint theme, set before the body renders so there's
    // no flash of the wrong theme. The switcher (js/theme.js) cycles this list in
    // order; to add a theme, add an entry here and a [data-ign-lamp="<id>"] token
    // block in css/ignition.css. scheme is Bootstrap's light/dark base; style is
    // 'classic' (the original stage look) or 'modern' (glow, glass panels, tracked labels).
    window.ignThemes = [
      { id: 'cool', label: 'Current · stage', scheme: 'dark', style: 'classic',  icon: 'bi bi-lightbulb' },
      { id: 'warm', label: 'Current · warm',  scheme: 'dark', style: 'classic',  icon: 'bi bi-lightbulb-fill' },
      { id: 'day',  label: 'Current · day',   scheme: 'light', style: 'classic', icon: 'bi bi-sun' },
      { id: 'graphite', label: 'Graphite ember',   scheme: 'dark', style: 'modern',   icon: 'bi bi-fire' },
      { id: 'slate',    label: 'Slate enterprise', scheme: 'light', style: 'modern',  icon: 'bi bi-building' },
      { id: 'midnight', label: 'Midnight indigo',  scheme: 'dark', style: 'modern',   icon: 'bi bi-moon-stars' },
      { id: 'forest',   label: 'Forest ops',       scheme: 'dark', style: 'modern',   icon: 'bi bi-tree' },
      { id: 'paper',    label: 'Paper mono',       scheme: 'light', style: 'modern',  icon: 'bi bi-file-text' },
      { id: 'teal',     label: 'Teal glass',       scheme: 'light', style: 'modern',  icon: 'bi bi-droplet' }
    ];
    (function () {
      var T = window.ignThemes, byId = {};
      T.forEach(function (t) { byId[t.id] = t; });
      var id = null;
      try {
        id = localStorage.getItem('ign-theme');
        if (id === 'dark') id = 'cool'; else if (id === 'light') id = 'day';   // legacy values
        if (!byId[id])
          id = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'cool' : 'day';
      } catch (e) { id = 'cool'; }
      document.documentElement.setAttribute('data-bs-theme', byId[id].scheme);
      document.documentElement.setAttribute('data-ign-lamp', id);
      document.documentElement.setAttribute('data-ign-style', byId[id].style);
    })();
  </script>
</head>
<body></body>
</html>
