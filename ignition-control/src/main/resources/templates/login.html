<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <title>Ignition · sign in</title>
  <link rel="stylesheet" href="/css/ignition.css">
</head>
<body>
  <h1>Ignition · sign in</h1>
  <div class="msg err" th:if="${param.error != null}">email or password not recognised</div>
  <div class="msg" th:if="${param.out != null}">signed out</div>
  <div class="msg" th:if="${param.created != null}">admin account created — sign in</div>
  <div class="msg" th:if="${param.activated != null}">account activated — sign in</div>
  <div class="msg" th:if="${param.pending != null}">password set — a platform admin must approve your account before you can sign in</div>
  <div class="msg" th:if="${param.reset != null}">password changed — sign in</div>
  <form method="post" th:action="@{/login}" class="stack">
    <label>Email <input name="email" type="email" autocomplete="username" autofocus required></label>
    <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
    <button>Sign in</button>
  </form>
  <p class="muted">
    <a href="/signup">Request an account</a> · <a href="/forgot">Forgot password</a>
  </p>
</body>
</html>
