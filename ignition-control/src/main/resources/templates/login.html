<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Ignition · sign in')}"></head>
<body>
  <div th:replace="~{fragments/auth :: auth(~{::main})}">
    <main>
      <h1 class="h4 mb-3">Sign in</h1>
      <div class="alert alert-danger" th:if="${param.error != null}">email or password not recognised</div>
      <div class="alert alert-success" th:if="${param.out != null}">signed out</div>
      <div class="alert alert-success" th:if="${param.created != null}">admin account created — sign in</div>
      <div class="alert alert-success" th:if="${param.activated != null}">account activated — sign in</div>
      <div class="alert alert-success" th:if="${param.pending != null}">password set — a platform admin must approve your account before you can sign in</div>
      <div class="alert alert-success" th:if="${param.reset != null}">password changed — sign in</div>
      <form method="post" th:action="@{/login}">
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input class="form-control" name="email" type="email" autocomplete="username" autofocus required>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input class="form-control" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn btn-accent w-100" type="submit">Sign in</button>
      </form>
      <p class="text-body-secondary small mt-3 mb-0 text-center">
        <a href="/signup">Request an account</a> · <a href="/forgot">Forgot password</a>
      </p>
    </main>
  </div>
</body>
</html>
