<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(|Ignition · reconfigure ${node.name}|)}"></head>
<body>
  <div th:replace="~{fragments/shell :: shell('nodes', ~{::main})}">
    <main>
      <p class="mb-3"><a href="/"><i class="bi bi-arrow-left"></i> Nodes</a></p>
      <div class="card" style="max-width:32rem">
        <div class="card-body p-4">
          <h1 class="h5 mb-3">Reconfigure <code th:text="${node.name}">node-1</code></h1>
          <div class="alert alert-danger" th:if="${error != null}" th:text="${error}">bad input</div>
          <form method="post" th:action="@{'/nodes/' + ${node.name}}">
            <div class="mb-3">
              <label class="form-label">Docker host</label>
              <input class="form-control" name="dockerHost" th:value="${node.dockerHost}" required
                     placeholder="local | ssh://ops@10.0.0.2 | tcp://host:2376">
            </div>
            <div class="row g-3 mb-3">
              <div class="col">
                <label class="form-label">CPUs</label>
                <input class="form-control" name="cpus" type="number" step="0.5" th:value="${node.cpus}" required>
              </div>
              <div class="col">
                <label class="form-label">Mem (GB)</label>
                <input class="form-control" name="memGb" type="number" step="1" th:value="${node.memGb}" required>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label">Labels</label>
              <input class="form-control" name="labels" th:value="${#strings.listJoin(node.labels, ',')}"
                     placeholder="fast,gpu (optional)">
            </div>
            <button class="btn btn-accent" type="submit">Save</button>
          </form>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
