<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"><title>Ignition · request an account</title>
  <link rel="stylesheet" href="/css/ignition.css">
</head>
<body>
  <h1>Request an account</h1>
  <div class="msg" th:if="${sent}">If that address can have an account, an activation link is on its way.</div>
  <div class="msg err" th:if="${error}" th:text="${error}">error</div>
  <form method="post" th:action="@{/signup}" class="stack" th:unless="${sent}">
    <label>Email <input name="email" type="email" autofocus required></label>
    <button>Send activation link</button>
  </form>
  <p class="muted">A platform admin approves new accounts after you set a password.
    <a href="/login">Back to sign in</a></p>
</body>
</html>
