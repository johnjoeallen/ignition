<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Ignition · request an account')}"></head>
<body>
  <div th:replace="~{fragments/auth :: auth(~{::main})}">
    <main>
      <h1 class="h4 mb-3">Request an account</h1>
      <div class="alert alert-success" th:if="${sent}">If that address can have an account, an activation link is on its way.</div>
      <div class="alert alert-danger" th:if="${error}" th:text="${error}">error</div>
      <form method="post" th:action="@{/signup}" th:unless="${sent}">
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input class="form-control" name="email" type="email" autofocus required>
        </div>
        <button class="btn btn-accent w-100" type="submit">Send activation link</button>
      </form>
      <p class="text-body-secondary small mt-3 mb-0">A platform admin approves new accounts after you set a password.
        <a href="/login">Back to sign in</a></p>
    </main>
  </div>
</body>
</html>
