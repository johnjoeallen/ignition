<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Ignition · roster')}"></head>
<body>
  <div th:replace="~{fragments/shell :: shell('teams', ~{::main})}">
    <main>
      <p class="mb-3"><a href="/"><i class="bi bi-arrow-left"></i> Teams</a></p>
      <h1 class="h4 page-title"><i class="bi bi-list-check"></i> Roster</h1>
      <p class="text-body-secondary small">One slug per line (or space/comma separated). <code>#</code> comments ignored.
        <b>Apply</b> queues a provision for each slug that isn't already a team;
        <b>Teardown</b> destroys each slug that is.</p>

      <div class="card mb-3">
        <div class="card-body">
          <form method="post" th:action="@{/roster/apply}">
            <textarea name="slugs" rows="10" class="form-control mb-3" style="font-family:monospace"
                      th:text="${slugs}" placeholder="quantum-badgers&#10;pixel-foxes&#10;neon-yaks"></textarea>
            <div class="d-flex gap-2">
              <button class="btn btn-accent" formaction="/roster/apply">Apply</button>
              <button class="btn btn-outline-danger" formaction="/roster/teardown"
                      onclick="return confirm('Destroy every listed team and its apps?')">Teardown</button>
            </div>
          </form>
        </div>
      </div>

      <form method="post" th:action="@{/sweep}" class="mb-4">
        <button class="btn btn-outline-secondary btn-sm">Sweep idle teams now</button>
      </form>

      <div th:if="${report != null}">
        <h2 class="h6 text-uppercase text-body-secondary">Result</h2>
        <ul>
          <li th:each="line : ${report}" th:text="${line}">slug — queued</li>
        </ul>
      </div>
    </main>
  </div>
</body>
</html>
