<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Ignition · teams')}"></head>
<body>
  <div th:replace="~{fragments/shell :: shell('teams', ~{::main})}">
    <main>
      <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 page-title">
        <h1 class="h4 mb-0"><i class="bi bi-people"></i> <span th:text="${isPlatformAdmin} ? 'Teams' : 'Your teams'">Teams</span></h1>
        <div class="d-flex gap-2" th:if="${isPlatformAdmin}">
          <a class="btn btn-outline-secondary btn-sm" href="/roster"><i class="bi bi-list-check"></i> Roster</a>
          <a class="btn btn-accent btn-sm" href="/zones/new"><i class="bi bi-plus-lg"></i> New team</a>
        </div>
      </div>
      <div class="alert alert-success" th:if="${param.m != null}" th:text="${#strings.replace(param.m[0],'+',' ')}">ok</div>

      <div class="table-card" th:if="${not zones.isEmpty()}">
        <table class="table table-hover mb-0">
          <thead>
            <tr>
              <th>team</th><th>your role</th><th>node</th><th>footprint</th><th>status</th><th>forge</th>
              <th th:if="${isPlatformAdmin}"></th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="z : ${zones}">
              <td><a class="fw-semibold" th:href="@{/zones/{slug}(slug=${z.slug})}" th:text="${z.slug}">quantum-badgers</a></td>
              <td>
                <span class="badge" th:if="${myRoles.get(z.slug) != null}"
                      th:classappend="${myRoles.get(z.slug).name() == 'ZONE_ADMIN'} ? 'text-bg-success' : 'text-bg-secondary'"
                      th:text="${myRoles.get(z.slug).name() == 'ZONE_ADMIN'} ? 'admin' : 'member'">member</span>
                <span class="text-body-secondary" th:if="${myRoles.get(z.slug) == null}">—</span>
              </td>
              <td th:text="${z.node}">node-1</td>
              <td th:text="|${z.zoneCpus}cpu / ${z.zoneMemGb}g|">5cpu/8g</td>
              <td th:with="p=${provisioning.get(z.slug)}">
                <span class="text-body-secondary" th:if="${p == null}">—</span>
                <span th:if="${p != null}" class="badge"
                      th:classappend="${p.state().name() == 'FAILED'} ? 'text-bg-danger' : 'text-bg-secondary'"
                      th:text="${p.state() + ': ' + p.message()}">provisioning</span>
              </td>
              <td><a th:href="${z.forgejoUrl + z.slug}" th:text="${z.forgejoUrl + z.slug}" class="small">git…</a></td>
              <td class="text-end text-nowrap" th:if="${isPlatformAdmin}">
                <form method="post" th:action="@{'/zones/' + ${z.slug} + '/move'}" class="d-inline">
                  <select name="node" class="form-select form-select-sm d-inline-block w-auto">
                    <option th:each="n : ${nodeNames}" th:value="${n}" th:text="${n}"
                            th:disabled="${n == z.node}">node</option>
                  </select>
                  <button class="btn btn-sm btn-outline-secondary">move</button>
                </form>
                <form method="post" th:action="@{'/zones/' + ${z.slug} + '/destroy'}" class="d-inline"
                      onsubmit="return confirm('Destroy team ' + this.action.split('/zones/')[1].split('/')[0] + ' and every app it deployed?')">
                  <button class="btn btn-sm btn-outline-danger">destroy</button>
                </form>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="card" th:if="${zones.isEmpty()}">
        <div class="card-body text-body-secondary text-center py-5" th:if="${isPlatformAdmin}">no teams yet</div>
        <div class="card-body text-body-secondary text-center py-5" th:unless="${isPlatformAdmin}">
          You're not on any team yet. Ask a team admin to add you, or a platform admin to make you one.
        </div>
      </div>
    </main>
  </div>
</body>
</html>
