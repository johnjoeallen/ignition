<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Ignition · your teams')}"></head>
<body>
  <div th:replace="~{fragments/shell :: shell('', ~{::main})}">
    <main>
      <h1 class="h4 page-title"><i class="bi bi-people"></i> Your teams</h1>

      <div class="table-card" th:if="${not myZones.isEmpty()}">
        <table class="table table-hover mb-0">
          <thead><tr><th>team</th><th>your role</th><th></th></tr></thead>
          <tbody>
            <tr th:each="z : ${myZones}">
              <td th:text="${z.slug}">quantum-badgers</td>
              <td>
                <span class="badge" th:classappend="${z.role.name() == 'ZONE_ADMIN'} ? 'text-bg-success' : 'text-bg-secondary'"
                      th:text="${z.role.name() == 'ZONE_ADMIN'} ? 'admin' : 'member'">member</span>
              </td>
              <td class="text-end">
                <a class="btn btn-sm btn-accent" th:href="@{/z(z=${z.slug})}">Open</a>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="card" th:if="${myZones.isEmpty()}">
        <div class="card-body text-body-secondary text-center py-5">
          You're not on any team yet. Ask a team admin to add you, or a
          platform admin to make you one.
        </div>
      </div>
    </main>
  </div>
</body>
</html>
