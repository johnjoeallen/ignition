<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Ignition · new team')}"></head>
<body>
  <div th:replace="~{fragments/shell :: shell('teams', ~{::main})}">
    <main>
      <p class="mb-3"><a href="/teams"><i class="bi bi-arrow-left"></i> Teams</a></p>
      <div class="card" style="max-width:32rem">
        <div class="card-body p-4">
          <h1 class="h5 mb-2">New team</h1>
          <p class="text-body-secondary small">Stands up Forgejo + a private DinD build engine + an Actions
            runner on a node, mints the bot account and the console / CI tokens.
            Runs in the background — watch it on the Teams page.</p>
          <div class="alert alert-danger" th:if="${error != null}" th:text="${error}">bad input</div>
          <form method="post" th:action="@{/zones}">
            <div class="mb-3">
              <label class="form-label">Slug</label>
              <input class="form-control" name="slug" required placeholder="quantum-badgers">
            </div>
            <div class="mb-3">
              <label class="form-label">Node</label>
              <input class="form-control" name="node" placeholder="(blank = scheduler picks one)">
            </div>
            <div class="mb-3">
              <label class="form-label">Label</label>
              <input class="form-control" name="label" placeholder="(blank = any node)">
            </div>
            <button class="btn btn-accent" type="submit">Provision</button>
          </form>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
