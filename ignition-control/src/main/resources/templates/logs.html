<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Ignition · logs')}"></head>
<body>
  <div th:replace="~{fragments/shell :: shell('logs', ~{::main})}">
    <main>
      <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 page-title">
        <h1 class="h4 mb-0"><i class="bi bi-terminal"></i> Logs</h1>
        <a class="btn btn-outline-secondary btn-sm" href="/logs"><i class="bi bi-arrow-clockwise"></i> Refresh</a>
      </div>
      <p class="text-body-secondary small">The last <span th:text="${lines.size()}">1000</span> lines from this
        <code>ignition-control</code> instance, newest first. In-memory only — a restart clears it; for anything
        older, <code>docker logs ignition-control</code> still has the full history.</p>
      <pre class="ign-log"><code th:each="line, it : ${lines}"
            th:class="${#strings.contains(line,' WARN ')} ? 'ign-log-warn' : (${#strings.contains(line,' ERROR ')} ? 'ign-log-error' : '')"
            th:text="${line}">log line</code></pre>
      <p class="text-body-secondary text-center py-4" th:if="${lines.isEmpty()}">nothing logged yet</p>
    </main>
  </div>
</body>
</html>
