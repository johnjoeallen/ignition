site_name: HackZone
site_description: Per-team hackathon infrastructure — isolated Forgejo + build sandbox + a live deployed demo app for every team, on one host.
site_url: https://johnjoeallen.github.io/hackzone-one/
repo_url: https://github.com/johnjoeallen/hackzone-one
repo_name: johnjoeallen/hackzone-one
edit_uri: edit/main/docs/
copyright: Apache License 2.0

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra_css:
  - assets/extra.css

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables
  - toc:
      permalink: true

exclude_docs: |
  requirements.txt

nav:
  - Home: index.md
  - Executive Overview: executive-overview.md
  - Roles: roles.md
  - Architecture: architecture.md
  - Operating an Event: operating-an-event.md
